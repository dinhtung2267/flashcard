<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Demo Học Tiếng Anh - Smart Split</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
  .container{width:100%;max-width:800px;background:#1e293b;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  
  .input-area{padding:15px;background:#0f172a;border-bottom:1px solid #334155;display:flex;flex-direction:column;gap:10px}
  .input-area input, .input-area textarea {width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;outline:none;font-family:monospace}
  .input-area textarea{height:100px;resize:vertical;font-size:.85rem}
  .input-area button{padding:12px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer}
  
  .video-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:none}
  #ytPlayer{width:100%;height:100%;border:none}
  
  #subArea{padding:20px;min-height:150px;display:none;flex-direction:column;justify-content:center;background:#111827;text-align:center}
  #subEn{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:700;line-height:1.8;margin-bottom:10px;color:#f8fafc}
  #subVi{font-size:clamp(1rem,3vw,1.3rem);color:#94a3b8;font-weight:500}
  
  .w{padding:0 2px; margin:0; display:inline-block; transition: color 0.1s ease}
  .w.read{color:#f8fafc}
  .w.current{color:#f59e0b; font-weight:900; text-shadow:0 0 10px rgba(245,158,11,0.3)}
</style>
</head>
<body>

<div class="container">
  <div class="input-area" id="setupArea">
    <input type="text" id="ytUrl" placeholder="1. Dán link YouTube..." value="https://youtu.be/dwEpmwk6YF8">
    <textarea id="ytSrt" placeholder="2. Dán nội dung SRT...">1

    <button onclick="startApp()">🚀 Bắt đầu Test Tự Động</button>
  </div>

  <div class="video-wrapper" id="videoWrapper">
    <div id="ytPlayer"></div>
  </div>

  <div id="subArea">
    <div id="subEn"></div>
    <div id="subVi"></div>
  </div>
</div>

<script>
let player, playerReady = false, subs = [], currentIdx = -1, syncInterval;

// Hàm tách cục SRT dài thành các câu ngắn dựa vào dấu câu
function splitSrtCues(cues) {
  let newCues = [];
  cues.forEach(cue => {
    // Tách câu tiếng Anh dựa vào dấu . ? !
    let sentences = cue.en.match(/[^.?!]+[.?!]*/g) || [cue.en];
    sentences = sentences.map(s => s.trim()).filter(s => s.length > 0);

    if (sentences.length <= 1) {
      newCues.push(cue);
      return;
    }

    let totalChars = sentences.reduce((sum, s) => sum + s.length, 0);
    let dur = cue.end - cue.start;
    let currentStart = cue.start;

    // Tách luôn câu tiếng Việt nếu có
    let viSentences = cue.vi ? (cue.vi.match(/[^.?!]+[.?!]*/g) || [cue.vi]).map(s=>s.trim()).filter(s=>s) : [];
    let viTotalChars = viSentences.reduce((sum, s) => sum + s.length, 0);
    let viCurrentIdx = 0;

    sentences.forEach((sentence, i) => {
      let ratio = sentence.length / totalChars;
      let thisDur = dur * ratio;
      
      // Chia đều câu tiếng Việt tương ứng
      let viText = "";
      if (viSentences.length > 0) {
        if (i === sentences.length - 1) {
           viText = viSentences.slice(viCurrentIdx).join(" ");
        } else {
           let targetViChars = viTotalChars * ratio;
           let acc = 0; let j = viCurrentIdx;
           while(j < viSentences.length && acc < targetViChars) {
             viText += viSentences[j] + " "; acc += viSentences[j].length; j++;
           }
           viCurrentIdx = j;
           viText = viText.trim();
        }
      }

      newCues.push({
        start: currentStart,
        end: currentStart + thisDur,
        en: sentence,
        vi: viText
      });
      currentStart += thisDur;
    });
  });
  return newCues;
}

function parseSRT(text) {
  let result = [];
  let blocks = text.replace(/\r\n/g, '\n').trim().split(/\n\n+/);
  let timeRe = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;
  let viRe = /[àáảãạăâầấẩẫậằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;

  blocks.forEach(block => {
    let lines = block.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length < 2) return;
    let timeLineIdx = -1;
    for(let i=0; i<lines.length; i++) { if(timeRe.test(lines[i])) { timeLineIdx = i; break; } }
    if (timeLineIdx === -1) return;
    let m = lines[timeLineIdx].match(timeRe);
    let start = (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/1000;
    let end = (+m[5])*3600 + (+m[6])*60 + (+m[7]) + (+m[8])/1000;
    let textLines = lines.slice(timeLineIdx + 1);
    let en = '', vi = '';
    if (textLines.length === 2) { en = textLines[0]; vi = textLines[1]; }
    else if (textLines.length > 2) { textLines.forEach(l => { if (viRe.test(l)) vi += l + ' '; else en += l + ' '; }); }
    else if (textLines.length === 1) { en = textLines[0]; }
    result.push({ start, end, en: en.trim(), vi: vi.trim() });
  });
  
  // Băm nhỏ SRT
  result = splitSrtCues(result);

  // Tự động hiện sớm
  const LEAD_TIME = 0.3;
  result.forEach(sub => {
    sub.start = Math.max(0, sub.start - LEAD_TIME);
  });

  return result;
}

function getSmartTimings(sub) {
  let words = sub.en.split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  let dur = sub.end - sub.start;
  let totalWeight = 0;
  let wordWeights = words.map(w => {
     let weight = Math.max(2, w.replace(/[^a-zA-Z]/g, '').length);
     if (/[,.]$/.test(w)) weight += 2;
     totalWeight += weight;
     return weight;
  });

  let timings = [], currentTime = sub.start;
  for (let i = 0; i < words.length; i++) {
    let w = words[i];
    let wordDur = (wordWeights[i] / totalWeight) * dur;
    let isPause = /[,.]$/.test(w);
    let readDur = isPause ? wordDur * 0.6 : wordDur;
    timings.push({ text: w, start: currentTime, end: currentTime + readDur, isPause: isPause });
    currentTime += wordDur; 
  }
  return timings;
}

function renderSub(idx) {
  let s = subs[idx];
  let enHtml = s.en.split(/(\s+)/).map(w => w.trim() === '' ? w : `<span class="w">${w}</span>`).join('');
  document.getElementById('subEn').innerHTML = enHtml;
  document.getElementById('subVi').textContent = s.vi;
}

function syncTick() {
  if (!playerReady) return;
  let t = player.getCurrentTime();
  let idx = -1;
  
  for (let i = 0; i < subs.length; i++) {
    if (t >= subs[i].start && t < subs[i].end) { idx = i; break; }
  }

  if (idx === -1) {
    if (currentIdx !== -1) {
      currentIdx = -1;
      document.getElementById('subEn').innerHTML = '';
      document.getElementById('subVi').textContent = '';
    }
    return;
  }

  if (idx !== currentIdx) {
    currentIdx = idx;
    renderSub(idx);
  }

  let s = subs[idx];
  let timings = getSmartTimings(s);
  let activeIndex = -1;
  let isPausing = false;

  for (let i = 0; i < timings.length; i++) {
    let tm = timings[i];
    if (t >= tm.start && t <= tm.end) { activeIndex = i; break; }
    else if (t > tm.end && tm.isPause) {
      if (i === timings.length - 1 || t < timings[i+1].start) { isPausing = true; break; }
    }
  }

  document.querySelectorAll('#subEn .w').forEach((w, i) => {
    w.classList.remove('read', 'current');
    if (isPausing) {
      if (i <= activeIndex || (activeIndex === -1 && i === 0)) w.classList.add('read'); 
    } else {
      if (i < activeIndex) w.classList.add('read');
      else if (i === activeIndex) w.classList.add('read', 'current');
    }
  });
}

window.startApp = function() {
  let url = document.getElementById('ytUrl').value.trim();
  let srtText = document.getElementById('ytSrt').value.trim();
  if(!url || !srtText) return alert('Nhập đủ Link và SRT!');
  
  let m = url.match(/(?:youtu\.be\/|v=)([^&]+)/);
  if (!m) return alert('Link sai!');
  subs = parseSRT(srtText);
  
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('videoWrapper').style.display = 'block';
  document.getElementById('subArea').style.display = 'flex';

  if (!window.YT) {
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    window.onYouTubeIframeAPIReady = () => initPlayer(m[1]);
  } else {
    initPlayer(m[1]);
  }
};

function initPlayer(vid) {
  if (player) player.destroy();
  player = new YT.Player('ytPlayer', {
    videoId: vid,
    playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
    events: {
      'onReady': (e) => { playerReady = true; e.target.playVideo(); },
      'onStateChange': (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          if (syncInterval) clearInterval(syncInterval);
          syncInterval = setInterval(syncTick, 60);
        } else {
          clearInterval(syncInterval);
        }
      }
    }
  });
}
</script>
</body>
</html>
