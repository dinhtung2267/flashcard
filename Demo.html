<head>
<meta charset="utf-8">

<title>Demo Học Tiếng Anh Qua Video</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
  .container{width:100%;max-width:800px;background:#1e293b;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  
  /* KHU VỰC NHẬP LIỆU */
  .input-area{padding:15px;background:#0f172a;border-bottom:1px solid #334155;display:flex;flex-direction:column;gap:10px}
  .input-area input, .input-area textarea {width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;outline:none;font-family:monospace}
  .input-area textarea{height:120px;resize:vertical;font-size:.85rem}
  .input-area button{padding:12px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;transition:background .2s}
  .input-area button:hover{background:#dc2626}
  
  /* VIDEO VÀ PHỤ ĐỀ */
  .video-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:none}
  #ytPlayer{width:100%;height:100%;border:none}
  
  #subArea{padding:20px;min-height:150px;display:none;flex-direction:column;justify-content:center;background:#111827;text-align:center}
  #subEn{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:800;line-height:1.6;margin-bottom:10px}
  #subVi{font-size:clamp(1rem,3vw,1.3rem);color:#fbbf24;font-weight:600}
  
  /* HIỆU ỨNG HIGHLIGHT TỐI ƯU */
  .w{padding:2px 4px;margin:0 1px;border-radius:4px;display:inline-block;transition:all 0.15s ease}
  .w.read{color:#64748b;opacity:0.7;background:transparent} /* Đã đọc: mờ xám */
  .w.current{background:#dc2626;color:#fff;font-weight:900;transform:scale(1.1);box-shadow:0 4px 10px rgba(220,38,38,0.5)} /* Đang đọc: đỏ rực */
</style>
</head>
<body>

<div class="container">
  <div class="input-area" id="setupArea">
    <input type="text" id="ytUrl" placeholder="1. Dán link YouTube vào đây..." value="https://youtu.be/dwEpmwk6YF8">
    <textarea id="ytSrt" placeholder="2. Dán nội dung file SRT vào đây...">1

    <button onclick="startApp()">🚀 Bắt đầu Test</button>
  </div>

  <div class="video-wrapper" id="videoWrapper">
    <div id="ytPlayer"></div>
  </div>

  <div id="subArea">
    <div id="subEn"></div>
    <div id="subVi"></div>
  </div>
</div>

<script>
let player, playerReady = false, subs = [], currentIdx = -1, syncInterval;

// 1. Parse SRT (Hỗ trợ cả SRT có số thứ tự hoặc không)
function parseSRT(text) {
  let result = [];
  let blocks = text.replace(/\r\n/g, '\n').trim().split(/\n\n+/);
  let timeRe = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;
  let viRe = /[àáảãạăâầấẩẫậằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;

  blocks.forEach(block => {
    let lines = block.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length < 2) return;
    
    let timeLineIdx = -1;
    for(let i=0; i<lines.length; i++) {
      if(timeRe.test(lines[i])) { timeLineIdx = i; break; }
    }
    if (timeLineIdx === -1) return;

    let m = lines[timeLineIdx].match(timeRe);
    let start = (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/1000;
    let end = (+m[5])*3600 + (+m[6])*60 + (+m[7]) + (+m[8])/1000;
    
    let textLines = lines.slice(timeLineIdx + 1);
    let en = '', vi = '';
    
    if (textLines.length === 2) { en = textLines[0]; vi = textLines[1]; }
    else if (textLines.length > 2) {
      textLines.forEach(l => { if (viRe.test(l)) vi += l + ' '; else en += l + ' '; });
    } else if (textLines.length === 1) {
      en = textLines[0];
    }
    
    result.push({ start, end, en: en.trim(), vi: vi.trim() });
  });
  return result;
}

// 2. Chia thời gian thông minh (Từ dài sáng lâu hơn, từ ngắn sáng nhanh)
function getSmartTimings(sub) {
  let words = sub.en.split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  let dur = sub.end - sub.start;
  let totalLen = words.reduce((sum, w) => sum + Math.max(2, w.length), 0);
  let timings = [], currentTime = sub.start;

  for (let w of words) {
    let weight = Math.max(2, w.length) / totalLen;
    let wordDur = dur * weight;
    if (/[.,?!;:]$/.test(w)) wordDur += 0.15; // Ngắt giọng ở dấu câu
    timings.push({ text: w, start: currentTime, end: currentTime + wordDur });
    currentTime += wordDur;
  }
  return timings;
}

// 3. Render HTML cho phụ đề
function renderSub(idx) {
  let s = subs[idx];
  let enHtml = s.en.split(/(\s+)/).map(w => w.trim() === '' ? w : `<span class="w">${w}</span>`).join('');
  document.getElementById('subEn').innerHTML = enHtml;
  document.getElementById('subVi').textContent = s.vi;
}

// 4. Các hàm Highlight
function highlightWords(aw) {
  document.querySelectorAll('#subEn .w').forEach((w, i) => {
    w.classList.remove('read', 'current');
    if (i < aw) w.classList.add('read');
    else if (i === aw) w.classList.add('read', 'current');
  });
}
function highlightAll() {
  document.querySelectorAll('#subEn .w').forEach(w => w.classList.add('read'));
}

// 5. Trái tim của App: Tick Sync (Chạy 60ms/lần)
function syncTick() {
  if (!playerReady) return;
  let t = player.getCurrentTime();
  let idx = -1;
  
  // Tìm câu phụ đề hiện tại
  for (let i = 0; i < subs.length; i++) {
    if (t >= subs[i].start && t < subs[i].end) { idx = i; break; }
  }

  // XỬ LÝ KHOẢNG LẶNG: Không có câu nào đang nói -> Xóa trắng phụ đề
  if (idx === -1) {
    if (currentIdx !== -1) {
      currentIdx = -1;
      document.getElementById('subEn').innerHTML = '';
      document.getElementById('subVi').textContent = '';
    }
    return;
  }

  // Nếu chuyển sang câu mới -> Render lại chữ
  if (idx !== currentIdx) {
    currentIdx = idx;
    renderSub(idx);
  }

  // HIGHLIGHT THÔNG MINH: Câu > 6s sáng cả câu, câu ngắn chạy từng từ
  let s = subs[idx];
  let cueDur = s.end - s.start;
  
  if (cueDur > 6) {
    highlightAll();
  } else {
    let timings = getSmartTimings(s);
    let aw = -1;
    for (let i = 0; i < timings.length; i++) {
      if (t >= timings[i].start) aw = i;
      if (t < timings[i].end && t >= timings[i].start) { aw = i; break; }
    }
    highlightWords(aw);
  }
}

// 6. Khởi tạo
window.startApp = function() {
  let url = document.getElementById('ytUrl').value.trim();
  let srtText = document.getElementById('ytSrt').value.trim();
  
  if(!url || !srtText) { alert('Vui lòng nhập đủ Link và SRT!'); return; }
  
  let m = url.match(/(?:youtu\.be\/|v=)([^&]+)/);
  if (!m) { alert('Link YouTube không hợp lệ!'); return; }
  let vid = m[1];

  subs = parseSRT(srtText);
  if(subs.length === 0) { alert('Lỗi định dạng SRT!'); return; }

  // Ẩn khu vực nhập, hiện Video và Phụ đề
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('videoWrapper').style.display = 'block';
  document.getElementById('subArea').style.display = 'flex';

  if (!window.YT) {
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    window.onYouTubeIframeAPIReady = () => initPlayer(vid);
  } else {
    initPlayer(vid);
  }
};

function initPlayer(vid) {
  if (player) player.destroy();
  player = new YT.Player('ytPlayer', {
    videoId: vid,
    playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
    events: {
      'onReady': (e) => { playerReady = true; e.target.playVideo(); },
      'onStateChange': (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          if (syncInterval) clearInterval(syncInterval);
          syncInterval = setInterval(syncTick, 60);
        } else {
          clearInterval(syncInterval);
        }
      }
    }
  });
}
</script>
